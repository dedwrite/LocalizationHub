[package]
name = "localizationhub"
version = "0.9.5"
description = "Desktop localization editor for structured game text and protected-token workflows."
authors = ["LocalizationHub Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-persisted-scope = "2.3.7"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls"] }
