name: Windows installer (manual, no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable --no-self-update
      - run: npm ci
      - name: Verify package and native versions agree
        run: |
          node -e "const fs=require('node:fs'),a=require('node:assert/strict'),v=require('./package.json').version;for(const f of ['frontend/package.json','website/package.json','collaboration-server/package.json','packages/core/package.json','packages/i18n/package.json','packages/ui/package.json','src-tauri/tauri.conf.json'])a.equal(JSON.parse(fs.readFileSync(f)).version,v,f);a.ok(fs.readFileSync('src-tauri/Cargo.toml','utf8').split('\n').find(l=>l.startsWith('version =')).includes(JSON.stringify(v)));"
      - run: npm test
      - run: npm run test:i18n
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:release
      - run: npm run verify:production --prefix frontend
      - name: Installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/LocalizationHub_${version}_x64-setup.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Expected installer is missing' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$installer.sha256", "$hash`n")
      - name: Upload candidate, never publish a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14
